<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mamá 🌷</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
    </div>

    <main>

        <div class="intro">
            <p>Hice esto especialmente para vos</p>
        </div>

        <div class="gift-area">

            <input type="checkbox" id="open">

            <label for="open" class="gift">

                <div class="bow">
                    <div class="bow-left"></div>
                    <div class="bow-right"></div>
                    <div class="bow-center"></div>
                </div>

                <div class="lid">
                    <div class="ribbon"></div>
                </div>

                <div class="box">
                    <div class="ribbon"></div>
                </div>

            </label>

            <div class="flower">

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>

                <div class="flower-head">
                    <div class="petal p1"></div>
                    <div class="petal p2"></div>
                    <div class="petal p3"></div>
                    <div class="petal p4"></div>
                    <div class="petal p5"></div>
                    <div class="petal p6"></div>
                    <div class="petal p7"></div>
                    <div class="petal p8"></div>

                    <div class="flower-center"></div>
                </div>

            </div>

        </div>

        <section class="message">

            <div class="line"></div>

            <h1>Para mamá</h1>

            <p>
                Gracias por estar siempre,
                por cuidarme, por acompañarme
                y por darme tanto amor.
            </p>

            <p class="special">
                Te quiero muchísimo. ❤️
            </p>

            <div class="heart">♥</div>

        </section>

        <p class="hint">Tocá el regalo</p>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Lourdes 🌼</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="background">
        <div class="glow"></div>

        <span class="sparkle s1">✦</span>
        <span class="sparkle s2">✦</span>
        <span class="sparkle s3">✦</span>
        <span class="sparkle s4">✦</span>
        <span class="sparkle s5">✦</span>
        <span class="sparkle s6">✦</span>
    </div>

    <main>

        <section class="intro">

            <div class="small-text">
                Hice esto para vos
            </div>

            <h1>
                Lourdes
            </h1>

            <div class="line"></div>

            <p>
                Porque hay personas que,
                sin darse cuenta,
                empiezan a ser importantes.
            </p>

        </section>


        <section class="flower-container">

            <div class="flower">

                <div class="flower-head">

                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>

                    <div class="flower-center"></div>

                </div>

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>

            </div>

        </section>


        <section class="final-message">

            <p>
                Para la mujer mas hermosa del mundo 
            </p>

            <div class="heart">
                ♡
            </div>

        </section>

    </main>

</body>
</html>
